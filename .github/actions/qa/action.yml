name: QA Gradle
description: Run QA tests with different Gradle versions

inputs:
  java-version:
    required: true
  gradle-version:
    required: true
  android-gradle-version:
    required: true
  sonar-runtime-version:
    required: false
  develocity-url:
    required: false
    default: ""
  use-develocity:
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: 2026.10.17
    - name: Expose mise JDKs to Gradle
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Gradle auto-detects JDKs in asdf's directory, but not mise's:
        # https://docs.gradle.org/9.7.1/userguide/toolchains.html#sec:auto_detection
        # The active Java installation locates mise's shared directory containing every installed JDK.
        mkdir -p "${HOME}/.asdf/installs"
        ln --force --symbolic --no-dereference --no-target-directory \
          "$(dirname "$(mise where java)")" \
          "${HOME}/.asdf/installs/java"
    - uses: ./.github/actions/setup-android
      if: runner.os == 'Linux' && inputs.android-gradle-version != 'NOT_AVAILABLE'
    - name: Get Vault secrets
      id: secrets
      uses: SonarSource/vault-action-wrapper@v3
      with:
        secrets: |
          development/github/token/licenses-ro token | GITHUB_TOKEN;
          development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
    - name: Configure Maven
      uses: SonarSource/ci-github-actions/config-maven@v2
      with:
        repox-url: https://repox.jfrog.io
        artifactory-reader-role: private-reader
        working-directory: integrationTests
        use-develocity: ${{ inputs.use-develocity }}
        develocity-url: ${{ inputs.develocity-url }}
    - name: Set Orchestrator Cache Variables
      shell: bash
      run: |
        CACHE_MONTH=$(date +'%Y-%m')
        echo "ORCHESTRATOR_CACHE_MONTH=$CACHE_MONTH" >> $GITHUB_ENV
        echo "ORCHESTRATOR_HOME=${{ github.workspace }}/orchestrator" >> $GITHUB_ENV
    - name: Cache Orchestrator
      uses: SonarSource/gh-action_cache@v1
      with:
        path: ${{ env.ORCHESTRATOR_HOME }}
        key: orchestrator-${{ env.ORCHESTRATOR_CACHE_MONTH }}-${{ github.run_id }}
        restore-keys: orchestrator-${{ env.ORCHESTRATOR_CACHE_MONTH }}-
    - name: Setup Orchestrator Home Directory
      shell: bash
      run: |
        mkdir -p "$ORCHESTRATOR_HOME"
        ls -lRh "$ORCHESTRATOR_HOME"
    - name: Run QA
      env:
        GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
        ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        SONARSOURCE_QA: true
        JAVA_VERSION: ${{ inputs.java-version }}
        GRADLE_VERSION: ${{ inputs.gradle-version }}
        ANDROID_GRADLE_VERSION: ${{ inputs.android-gradle-version }}
        SONAR_RUNTIME_VERSION: ${{ inputs.sonar-runtime-version }}
      shell: bash
      run: |
        source ./.github/scripts/set-version-from-build-number.sh
        mise exec java@"${JAVA_VERSION}" -- java -version
        mise exec java@"${JAVA_VERSION}" -- mvn -f property-dump-plugin/pom.xml --batch-mode install
        cd integrationTests
        mise exec java@"${JAVA_VERSION}" -- mvn --errors --batch-mode --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.7:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false
        mise exec java@"${JAVA_VERSION}" -- mvn --errors --batch-mode --no-transfer-progress clean verify -Dgradle.version="${GRADLE_VERSION}" -DandroidGradle.version="${ANDROID_GRADLE_VERSION}" -Dsonar.runtimeVersion="${SONAR_RUNTIME_VERSION}"
