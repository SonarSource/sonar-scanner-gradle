name: Setup Android SDK
description: Configure the Android SDK required by the build and QA tests. Requires Android command-line tools such as sdkmanager to be installed (using mise or otherwise).

runs:
  using: composite
  steps:
    - name: Accept Android SDK licenses
      shell: bash
      run: |
        license_log="$(mktemp)"
        for url in \
          https://dl.google.com/android/repository/addons_list-6.xml \
          https://dl.google.com/android/repository/repository2-1.xml; do
          for method in HEAD GET; do
            for protocol in --http1.1 --http2; do
              echo "Probe $method $protocol $url"
              if [[ "$method" == HEAD ]]; then
                curl_args=(--head)
              else
                curl_args=()
              fi
              if timeout 8s curl "$protocol" "${curl_args[@]}" --silent --show-error --output /dev/null \
                --write-out 'HTTP %{http_code}; connect %{time_connect}s; TLS %{time_appconnect}s; first byte %{time_starttransfer}s\n' \
                "$url"; then
                echo "Probe succeeded"
              else
                echo "Probe failed: $?"
              fi
            done
          done
        done
        (
          sleep 30
          echo "SDK manager processes after 30 seconds:"
          ps -eo pid,ppid,etime,args | grep '[s]dkmanager' || true
          sdkmanager_pid="$(jcmd -l | awk '/SdkManagerCli/ { print $1; exit }')"
          if [[ -n "$sdkmanager_pid" ]]; then
            echo "SDK manager JVM thread dump:"
            timeout 10s jcmd "$sdkmanager_pid" Thread.print | head -n 120 || true
            echo "SDK manager proxy properties:"
            timeout 10s jcmd "$sdkmanager_pid" VM.system_properties | grep -Ei '(^|\.)[a-z]+proxy(host|port|user)=' | sed -E 's/=.*/=<set>/' || true
          fi
          echo "Android repository connectivity:"
          timeout 10s curl --head --silent --show-error https://dl.google.com/android/repository/repository2-1.xml | head -n 10 || true
        ) &
        diagnostics_pid=$!

        # Keep the same license command as the failing job while limiting this diagnostic run.
        if timeout --kill-after=10s 90s bash -c 'yes 2>/dev/null | sdkmanager --sdk_root="$ANDROID_HOME" --licenses' > "$license_log" 2>&1; then
          status=0
        else
          status=$?
        fi

        kill "$diagnostics_pid" 2>/dev/null || true
        wait "$diagnostics_pid" 2>/dev/null || true
        echo "Last SDK manager output:"
        tail -n 10 "$license_log"
        rm -f "$license_log"
        exit "$status"
    - name: Install Android SDK packages
      shell: bash
      run: |
        sdkmanager --sdk_root="${ANDROID_HOME}" \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0"
