name: Setup Android SDK
description: Configure the Android SDK required by the build and QA tests. Requires Android command-line tools such as sdkmanager to be installed (using mise or otherwise).

runs:
  using: composite
  steps:
    - name: Accept Android SDK licenses
      shell: bash
      run: |
        license_log="$(mktemp)"
        (
          sleep 30
          echo "SDK manager processes after 30 seconds:"
          ps -eo pid,ppid,etime,args | grep '[s]dkmanager' || true
          sdkmanager_pid="$(jcmd -l | awk '/SdkManagerCli/ { print $1; exit }')"
          if [[ -n "$sdkmanager_pid" ]]; then
            echo "SDK manager JVM thread dump:"
            timeout 10s jcmd "$sdkmanager_pid" Thread.print | head -n 120 || true
            echo "SDK manager proxy properties:"
            timeout 10s jcmd "$sdkmanager_pid" VM.system_properties | grep -Ei '(^|\.)[a-z]+proxy(host|port|user)=' | sed -E 's/=.*/=<set>/' || true
          fi
          echo "Android repository connectivity:"
          timeout 10s curl --head --silent --show-error https://dl.google.com/android/repository/repository2-1.xml | head -n 10 || true
        ) &
        diagnostics_pid=$!

        # Accept licenses while showing SDK output in this bounded diagnostic run.
        set -o pipefail
        if timeout --kill-after=10s 5m bash -c 'yes 2>/dev/null | sdkmanager --sdk_root="$ANDROID_HOME" --licenses' 2>&1 | tee "$license_log"; then
          status=0
        else
          status=$?
        fi

        kill "$diagnostics_pid" 2>/dev/null || true
        wait "$diagnostics_pid" 2>/dev/null || true
        echo "Last SDK manager output:"
        tail -n 10 "$license_log"
        rm -f "$license_log"
        exit "$status"
    - name: Install Android SDK packages
      shell: bash
      run: |
        sdkmanager --sdk_root="${ANDROID_HOME}" \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0"
