name: Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Probe Android network on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [sonar-l, sonar-m, github-ubuntu-latest-s]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Probe Android repository over HTTP/1.1
        shell: bash
        run: |
          curl --http1.1 --max-time 15 --silent --show-error --output /dev/null \
            --write-out 'HTTP %{http_code}; first byte %{time_starttransfer}s\n' \
            https://dl.google.com/android/repository/addons_list-6.xml
