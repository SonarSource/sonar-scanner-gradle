name: Prepare Next Development Iteration

on:
  workflow_dispatch:
    inputs:
      nextVersion:
        description: Version number of the next iteration
        required: true

jobs:
  Next-Iteration-Job:
    name: Next Iteration Job
    runs-on: sonar-xs
    permissions:
      id-token: write
      pull-requests: write
      contents: write

    steps:

      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17

      - name: Configure Maven
        uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          repox-url: https://repox.jfrog.io
          artifactory-reader-role: private-reader
          working-directory: .

      - name: Update Version Number
        env:
          NEXT_VERSION: ${{ inputs.nextVersion }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global core.autocrlf input
          git config --global core.safecrlf true
          BRANCH="gh-action/next-iteration.${{ github.run_id }}"
          git checkout -b "$BRANCH"
          pushd integrationTests
          mvn versions:set -DgenerateBackupPoms=false -DnewVersion="$NEXT_VERSION"
          git add pom.xml
          popd
          sed --in-place "s/version=.*$/version=$NEXT_VERSION/" gradle.properties
          git add gradle.properties
          git commit -m "Prepare next development iteration $NEXT_VERSION"
          git push --set-upstream origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ inputs.nextVersion }}
        run: |
          gh pr create --base master --title "Prepare next development iteration $NEXT_VERSION" --body ""
