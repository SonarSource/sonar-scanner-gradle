buildscript {
    repositories {
        def repoxBaseUrl = System.getenv('ARTIFACTORY_RESOLVE_URL') ?: System.getenv('ARTIFACTORY_URL') ?: 'https://repox.jfrog.io/artifactory'
        def repoxRepositoryUrl = System.getenv('SONARSOURCE_REPOSITORY_URL') ?: repoxBaseUrl.replaceAll('/+$', '') + '/' + (System.getenv('SONARSOURCE_REPOSITORY') ?: 'sonarsource-qa')
        mavenLocal()
        def repox = findByName('Repox') ?: maven {
            name = 'Repox'
            def artifactoryUsername = System.getenv('ARTIFACTORY_USERNAME') ?: project.findProperty('artifactoryUsername')
            def artifactoryPassword = System.getenv('ARTIFACTORY_ACCESS_TOKEN') ?: System.getenv('ARTIFACTORY_PASSWORD') ?: project.findProperty('artifactoryPassword')
            if (artifactoryUsername && artifactoryPassword) {
                credentials {
                    username = artifactoryUsername
                    password = artifactoryPassword
                }
            }
        }
        repox.url = uri(repoxRepositoryUrl)
    }
    dependencies { classpath 'org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:${version}' }
}

apply plugin: 'java'
apply plugin: 'org.sonarqube'

sourceCompatibility = 1.8
targetCompatibility = 1.8

allprojects {  
  ext.baseVersion = "0.1"
  ext.snapshotVersion = true
  
  group = "org.sonar.tests"
  version = "$baseVersion" + (snapshotVersion ? "-SNAPSHOT" : "")
}

sonar {
    properties {
        property "sonar.projectName", "Simple Java Gradle Project"
        property "sonar.projectKey", "org.codehaus.sonar:example-java-gradle"
    }
}

tasks.getByName("sonar").useLoggerLevel(LogLevel.DEBUG)

test {
  ignoreFailures = true
}

dependencies {
    implementation group: 'commons-io', name: 'commons-io', version: '2.5'
    testImplementation group: 'junit', name: 'junit', version: '4.10'
}

repositories {
    def repoxBaseUrl = System.getenv('ARTIFACTORY_RESOLVE_URL') ?: System.getenv('ARTIFACTORY_URL') ?: 'https://repox.jfrog.io/artifactory'
    def repoxRepositoryUrl = System.getenv('SONARSOURCE_REPOSITORY_URL') ?: repoxBaseUrl.replaceAll('/+$', '') + '/' + (System.getenv('SONARSOURCE_REPOSITORY') ?: 'sonarsource-qa')
    mavenLocal()
    def repox = findByName('Repox') ?: maven {
        name = 'Repox'
        def artifactoryUsername = System.getenv('ARTIFACTORY_USERNAME') ?: project.findProperty('artifactoryUsername')
        def artifactoryPassword = System.getenv('ARTIFACTORY_ACCESS_TOKEN') ?: System.getenv('ARTIFACTORY_PASSWORD') ?: project.findProperty('artifactoryPassword')
        if (artifactoryUsername && artifactoryPassword) {
            credentials {
                username = artifactoryUsername
                password = artifactoryPassword
            }
        }
    }
    repox.url = uri(repoxRepositoryUrl)
}
