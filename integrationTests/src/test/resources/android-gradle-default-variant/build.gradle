buildscript {
  repositories {
      def repoxBaseUrl = System.getenv('ARTIFACTORY_RESOLVE_URL') ?: System.getenv('ARTIFACTORY_URL') ?: 'https://repox.jfrog.io/artifactory'
      def repoxRepositoryUrl = System.getenv('SONARSOURCE_REPOSITORY_URL') ?: repoxBaseUrl.replaceAll('/+$', '') + '/' + (System.getenv('SONARSOURCE_REPOSITORY') ?: 'sonarsource-qa')
      mavenLocal()
      def repox = findByName('Repox') ?: maven {
          name = 'Repox'
          def artifactoryUsername = System.getenv('ARTIFACTORY_USERNAME') ?: project.findProperty('artifactoryUsername')
          def artifactoryPassword = System.getenv('ARTIFACTORY_ACCESS_TOKEN') ?: System.getenv('ARTIFACTORY_PASSWORD') ?: project.findProperty('artifactoryPassword')
          if (artifactoryUsername && artifactoryPassword) {
              credentials {
                  username = artifactoryUsername
                  password = artifactoryPassword
              }
          }
      }
      repox.url = uri(repoxRepositoryUrl)
  }
  dependencies {
    classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:${version}"
    classpath "com.android.tools.build:gradle:${androidGradle.version}"
  }
}

apply plugin: 'jacoco'
apply plugin: 'com.android.application'
apply plugin: 'org.sonarqube'

repositories {
    def repoxBaseUrl = System.getenv('ARTIFACTORY_RESOLVE_URL') ?: System.getenv('ARTIFACTORY_URL') ?: 'https://repox.jfrog.io/artifactory'
    def repoxRepositoryUrl = System.getenv('SONARSOURCE_REPOSITORY_URL') ?: repoxBaseUrl.replaceAll('/+$', '') + '/' + (System.getenv('SONARSOURCE_REPOSITORY') ?: 'sonarsource-qa')
    def repox = findByName('Repox') ?: maven {
        name = 'Repox'
        def artifactoryUsername = System.getenv('ARTIFACTORY_USERNAME') ?: project.findProperty('artifactoryUsername')
        def artifactoryPassword = System.getenv('ARTIFACTORY_ACCESS_TOKEN') ?: System.getenv('ARTIFACTORY_PASSWORD') ?: project.findProperty('artifactoryPassword')
        if (artifactoryUsername && artifactoryPassword) {
            credentials {
                username = artifactoryUsername
                password = artifactoryPassword
            }
        }
    }
    repox.url = uri(repoxRepositoryUrl)
}

dependencies {
  implementation 'joda-time:joda-time:2.7'
  testImplementation 'junit:junit:4.12'
}

android {
  // compileSdkVersion is removed in newer AGP versions; use compileSdk with assignment
  compileSdk = 30

  buildTypes {
    release {
      // testCoverageEnabled was replaced by enableUnitTestCoverage / enableAndroidTestCoverage
      enableUnitTestCoverage = true
    }
  }

  // Arrays require the standard Groovy assignment syntax
  flavorDimensions = ["tier", "minApi"]

  // Namespace must use assignment
  namespace = "org.hello"

  productFlavors {
    demo {
      applicationId = "com.example.myapp.demo"
      versionName = "1.0-demo"
      dimension = "tier"
      minSdk = 21 // minSdkVersion is removed; use minSdk
    }
    full {
      applicationId = "com.example.myapp.full"
      versionName = "1.0-full"
      dimension = "tier"
      minSdk = 25
    }
    minApi23 {
      dimension = "minApi"
      minSdk = 23
    }
    minApi18 {
      dimension = "minApi"
    }
  }
}

sonar {
  properties {
    // These are method calls property(String, Object) in the Sonar plugin rather
    // than standard variable assignments, so they use parenthesis instead of '='.
    property("sonar.projectName", "Simple Android Gradle Project")
    property("sonar.projectKey", "org.sonarqube:example-android-gradle")
  }
}
