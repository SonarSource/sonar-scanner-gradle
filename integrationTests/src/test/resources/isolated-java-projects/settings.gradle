pluginManagement {
  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == 'org.sonarqube') {
        useModule("org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:${requested.version}")
      }
    }
  }
  repositories {
    mavenLocal()
    gradlePluginPortal()
    mavenCentral()
  }
}

plugins {
  id 'org.sonarqube' version '${version}'
}

rootProject.name = 'isolated-java-projects'
include 'child'
