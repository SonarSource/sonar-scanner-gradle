buildscript {
    repositories {
        def repoxBaseUrl = System.getenv('ARTIFACTORY_RESOLVE_URL') ?: System.getenv('ARTIFACTORY_URL')
        def repoxRepositoryUrl = System.getenv('SONARSOURCE_REPOSITORY_URL') ?: (repoxBaseUrl ? repoxBaseUrl.replaceAll('/+$', '') + '/' + (System.getenv('SONARSOURCE_REPOSITORY') ?: 'sonarsource-qa') : null)
        if (repoxRepositoryUrl) {
            mavenLocal()
            def repox = findByName('Repox') ?: maven {
                name = 'Repox'
                def artifactoryUsername = System.getenv('ARTIFACTORY_USERNAME') ?: project.findProperty('artifactoryUsername')
                def artifactoryPassword = System.getenv('ARTIFACTORY_ACCESS_TOKEN') ?: System.getenv('ARTIFACTORY_PASSWORD') ?: project.findProperty('artifactoryPassword')
                if (artifactoryUsername && artifactoryPassword) {
                    credentials {
                        username = artifactoryUsername
                        password = artifactoryPassword
                    }
                }
            }
            repox.url = uri(repoxRepositoryUrl)
        } else {
            mavenCentral()
            mavenLocal()
        }
    }
    dependencies { classpath("org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:${version}") }
}

plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '1.9.20'
    id 'application'
}

apply plugin: 'org.sonarqube'

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    def repoxBaseUrl = System.getenv('ARTIFACTORY_RESOLVE_URL') ?: System.getenv('ARTIFACTORY_URL')
    def repoxRepositoryUrl = System.getenv('SONARSOURCE_REPOSITORY_URL') ?: (repoxBaseUrl ? repoxBaseUrl.replaceAll('/+$', '') + '/' + (System.getenv('SONARSOURCE_REPOSITORY') ?: 'sonarsource-qa') : null)
    if (repoxRepositoryUrl) {
        def repox = findByName('Repox') ?: maven {
            name = 'Repox'
            def artifactoryUsername = System.getenv('ARTIFACTORY_USERNAME') ?: project.findProperty('artifactoryUsername')
            def artifactoryPassword = System.getenv('ARTIFACTORY_ACCESS_TOKEN') ?: System.getenv('ARTIFACTORY_PASSWORD') ?: project.findProperty('artifactoryPassword')
            if (artifactoryUsername && artifactoryPassword) {
                credentials {
                    username = artifactoryUsername
                    password = artifactoryPassword
                }
            }
        }
        repox.url = uri(repoxRepositoryUrl)
    } else {
        mavenCentral()
        maven { url 'https://maven.pkg.jetbrains.space/public/p/kotlinx-html/maven' }
    }
}

kotlin {
    jvm {
        withJava()
        testRuns["test"].executionTask.configure {
            useJUnitPlatform()
        }
    }
    sourceSets {
        commonMain {

        }
        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
        jvmMain {
            dependencies {
                implementation 'io.ktor:ktor-server-netty:2.0.2'
                implementation 'io.ktor:ktor-server-html-builder-jvm:2.0.2'
                implementation 'org.jetbrains.kotlinx:kotlinx-html-jvm:0.7.2'
            }
        }
        jvmTest {

        }
    }
}

application {
    mainClassName = 'org.example.application.ServerKt'
}

tasks.named('run') {
    dependsOn(tasks.named('jvmJar'))
    classpath(tasks.named('jvmJar'))
}
